[project]
name = "tsn-bench"
version = "0.1.0"
description = "Synthetic TSN scheduling dataset generator and baseline schedulers (foundation phase)"
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.2",
    "numpy>=1.26",
    "ortools>=9.9",
    "pandas>=2.2",
    "scipy>=1.12",
    "pyyaml>=6.0",
    "tabulate>=0.9",
]

[tool.setuptools.packages.find]
include = ["tsn_bench*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
