# Aggregate-scaling probe (Stage 2 of the scaling investigation -- Stage 1
# is scaling_probe.yaml, which fixed switch_count and swept load_factor
# alone). This one combines BOTH axes: topology size AND an aggregate
# (not single-link) capacity target, via generator.py's new
# `capacity_scale_links` parameter (flows.capacity_scale_divisor below).
# Answers the gap flagged in PROGRESS.md's 2026-09-17 node/flow-count
# entry -- "no test of nodes and flows scaling together" -- directly.
#
# capacity_scale_divisor: 20 was calibrated locally before committing any
# cluster time (see PROGRESS.md/TEST_PLAN.md's load-factor-fix entry):
# target capacity = load_factor * link_rate_mbps * max(1, round(n_links / 20)).
# At switch_count 2/8/16 that's a 1x/2x/4x multiplier -- confirmed
# tractable (359/723/1430 flows, 0.35s/0.92s/9.22s B1 solve time at
# near_saturation=0.85) before adding stress on top of it.
#
# NOT the main dataset -- a separate, smaller one, same discipline as
# scaling_probe.yaml. Feeds tsn_bench.eval.run_baselines directly
# (B1/B2/B3 only).
#
# Usage:
#   python -m tsn_bench.dataset.build_dataset --config configs/aggregate_scaling.yaml --out data_aggregate_scaling --time-limit-s 150
#   python -m tsn_bench.eval.run_baselines --data data_aggregate_scaling --out results/aggregate_scaling.jsonl --time-limit-s 150

seed: 8484

topology:
  in_distribution_switch_counts: [2, 8, 16]   # small/medium/large sample, not the full 2,4,6,8,12,16 -- keeps total instances manageable given solve times climb fast at the high end
  held_out_switch_counts: []            # not relevant here -- no SLM eval, matches scaling_probe.yaml
  talkers_per_switch: [1, 3]
  listeners_per_switch: [1, 3]
  link_rate_mbps: 1000
  instances_per_size: 5

flows:
  tt_profiles:
    - { size_bytes: 50, period_us: 250, deadline_us: 1000 }
    - { size_bytes: 100, period_us: 500, deadline_us: 1000 }
    - { size_bytes: 500, period_us: 1000, deadline_us: 1000 }
  avb_profile:
    size_bytes_range: [1000, 1200]
    period_us: 4000
    deadline_us: 2000
  avb_fraction: 0.25
  max_attempts: 20000                   # see scaling_probe.yaml -- default 2000 caps flow count too early
  capacity_scale_divisor: 20            # the new knob this config exists to exercise
  load_factors:
    near_saturation: 0.85               # continuity point with the main dataset
    stress_2x: 2.0                      # confirmed to produce real stress at switch_count=16
                                         # (75% admission, 92s solve) while staying easy at
                                         # switch_count 2/8 -- stress_4x was tried locally and
                                         # ruled out as too slow (150s+) for a real dataset run

node_addition:
  scenarios: [single]                   # drop batch -- matches scaling_probe.yaml, keeps instance count down
  batch_size_range: [2, 4]

splits:
  train: 1.0                            # irrelevant for this probe (no held-out sizes, no SLM eval)
  val: 0.0
  test: 0.0

seeds_per_config: 2
