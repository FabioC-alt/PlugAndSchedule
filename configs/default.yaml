# Default configuration for dataset generation and baseline evaluation.
# Referenced by tsn_bench.dataset.build_dataset and tsn_bench.eval.run_baselines.

seed: 42

topology:
  # switch counts to generate topology families for
  in_distribution_switch_counts: [2, 4, 6, 8]
  held_out_switch_counts: [12, 16]      # never used for train/val — zero-shot generalization test
  talkers_per_switch: [1, 3]            # inclusive range, randomized per topology
  listeners_per_switch: [1, 3]
  link_rate_mbps: 1000
  instances_per_size: 20                # topology instances generated per switch count

flows:
  tt_profiles:                          # (size_bytes, period_us), deadline defaults to period
    - { size_bytes: 50, period_us: 250, deadline_us: 1000 }
    - { size_bytes: 100, period_us: 500, deadline_us: 1000 }
    - { size_bytes: 500, period_us: 1000, deadline_us: 1000 }
  avb_profile:
    size_bytes_range: [1000, 1200]
    period_us: 4000
    deadline_us: 2000
  avb_fraction: 0.25                    # fraction of flows that are AVB vs TT
  load_factors:                         # target requested-bandwidth / link-capacity ratio
    low: 0.2
    medium: 0.5
    near_saturation: 0.85

node_addition:
  scenarios: [single, batch]
  batch_size_range: [2, 4]

splits:
  train: 0.7
  val: 0.15
  test: 0.15
  # held-out switch counts always go to their own split regardless of these ratios

seeds_per_config: 3   # random seeds per (topology_size, load_factor, scenario) cell
